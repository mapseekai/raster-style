name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04@sha256:3612b800eaae8513e7dca54f21d2e4eda48eda57426f3746a78677f342ac7ee9
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and verify locked system packages
        run: bash scripts/setup-ci-system.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/go/go.mod
          cache: false
      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Verify toolchain versions
        run: |
          node --version
          npm --version
          pnpm --version
          go version
          rustc --version
          cargo --version
          python3 --version
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "10.9.9"
          test "$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          test "$(go env GOVERSION)" = "go$(sed -n 's/^go //p' packages/go/go.mod)"
          test "$(python3 --version)" = "Python $(cat .python-version)"
          rust_version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          test "$(rustc --version | cut -d ' ' -f 2)" = "$rust_version"
          test "$(cargo --version | cut -d ' ' -f 2)" = "$rust_version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:all
